# The full check plus both builds (the game and the dev site) for every pull request and for
# pushes to feature and hotfix branches. Deploys nothing; deploy.yml publishes main and develop.
name: CI

on:
  pull_request:
  push:
    branches: ['feature/**', 'hotfix/**']

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typecheck, lint, validate:data, unit tests, golden replays, sim smoke, bench --quick (SPEC §15.1)
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - run: npm run build:dev
